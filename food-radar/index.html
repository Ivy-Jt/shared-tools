<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta property="og:title" content="武汉美食优惠雷达">
<meta property="og:description" content="每日筛选武汉 PASS 可兑换免费试，并汇总大众点评 App 已确认可使用的已购美食套餐。">
<title>武汉美食优惠雷达</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:light;--ink:#251a12;--muted:#74665b;--paper:#fffdf9;--line:#eadfd3;--accent:#d85b25;--soft:#fff0df;--green:#247a58;--score-high:#e5f5ec;--score-high-ink:#176a4a;--score-mid:#fff1c9;--score-mid-ink:#885b08;--score-low:#fde5e3;--score-low-ink:#a13d36;--score-na:#eceeef;--score-na-ink:#6b7075;--expiry-urgent:#bd3128;--expiry-urgent-bg:#fde8e6;--expiry-watch:#a96b08;--expiry-watch-bg:#fff1c9;--expiry-safe:#23754f;--expiry-safe-bg:#e5f5ec}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#fff6e9 0,#f8f4ef 42%,#f6f7f8 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(760px,100%);margin:0 auto;padding:24px 16px 56px}
a{color:inherit}
.back{display:inline-flex;align-items:center;min-height:40px;color:var(--muted);font-size:14px;text-decoration:none}
.hero{padding:24px 0 18px}
.eyebrow{margin:0 0 8px;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.08em}
h1{margin:0;font-size:30px;line-height:1.18;letter-spacing:-.03em}
.lede{margin:12px 0 0;color:var(--muted);font-size:15px;line-height:1.7}
.quick-nav{position:sticky;top:0;z-index:600;display:flex;gap:8px;margin:0 0 12px;padding:6px;border:1px solid rgba(234,223,211,.9);border-radius:14px;background:rgba(255,253,249,.93);box-shadow:0 8px 24px rgba(53,34,20,.08);backdrop-filter:blur(12px);overflow-x:auto}
.quick-nav a{display:inline-flex;flex:1 0 auto;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.quick-nav a.primary{background:var(--ink);color:#fff}
.summary{display:flex;gap:10px;align-items:flex-start;margin:18px 0 22px;padding:14px 16px;border:1px solid #f0d6bc;border-radius:16px;background:rgba(255,248,239,.88)}
.summary-dot{flex:0 0 auto;width:9px;height:9px;margin-top:6px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 5px rgba(216,91,37,.12)}
.summary strong{display:block;font-size:15px}
.summary span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.5}
.section{margin-top:28px;scroll-margin-top:72px}
.section-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.section-head h2{margin:0;font-size:21px}
.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.target{flex:0 0 auto;color:var(--accent);font-size:12px;font-weight:700}
.list{display:grid;gap:16px}
.card{overflow:hidden;scroll-margin-top:72px;border:1px solid var(--line);border-radius:18px;background:rgba(255,253,249,.96);box-shadow:0 8px 26px rgba(53,34,20,.06)}
.card-body{padding:18px}
.topline{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:999px;background:var(--soft);color:#a74319;font-size:12px;font-weight:700}
.tag-owned{background:#2b2927;color:#fff}
.platform{background:#eef1f4;color:#3f4952}
.vip{background:#2b2927;color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag.weekend{background:#eef1f4;color:#3f4952}
.tag.weekend-unknown{background:#f0ece7;color:#74665b}
.tag.expiry-urgent{background:var(--expiry-urgent-bg);color:var(--expiry-urgent)}
.tag.expiry-watch{background:var(--expiry-watch-bg);color:var(--expiry-watch)}
.tag.expiry-safe{background:var(--expiry-safe-bg);color:var(--expiry-safe)}
.price{display:flex;flex:0 0 auto;gap:6px;align-items:baseline;color:var(--green);font-size:14px;font-weight:800;text-align:right}
.price-current{font-size:19px}
.price del{color:#9a9188;font-size:12px;font-weight:600}
h2{margin:13px 0 5px;font-size:19px;line-height:1.42}
.card h2{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.place{margin:0;color:var(--muted);font-size:13px}
.menu{display:-webkit-box;margin:11px 0 0;padding:10px 11px;overflow:hidden;border-radius:12px;background:#f8f5f1;color:#4d3a2d;font-size:13px;line-height:1.55;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.menu strong{color:var(--ink)}
.purchase-more{margin-top:11px;border:1px solid var(--line);border-radius:13px;background:#fff}
.purchase-more>summary{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:11px 12px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:800;list-style:none}
.purchase-more>summary::-webkit-details-marker{display:none}
.purchase-more>summary::after{content:"展开";flex:0 0 auto;color:var(--accent);font-size:11px}
.purchase-more[open]>summary::after{content:"收起"}
.purchase-more-body{padding:0 10px 10px}
.compact-use{margin:0 0 9px;padding:9px 10px;border-radius:10px;background:#f8f5f1;color:var(--muted);font-size:12px;line-height:1.55}
.compact-use p{margin:0}
.compact-use p+p{margin-top:4px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:16px 0}
.metric{padding:10px;border-radius:12px;background:#f8f5f1}
.metric b{display:block;font-size:15px}
.metric span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.metric.score-high{background:var(--score-high)}
.metric.score-high b,.metric.score-high span{color:var(--score-high-ink)}
.metric.score-mid{background:var(--score-mid)}
.metric.score-mid b,.metric.score-mid span{color:var(--score-mid-ink)}
.metric.score-low{background:var(--score-low)}
.metric.score-low b,.metric.score-low span{color:var(--score-low-ink)}
.metric.score-na{background:var(--score-na)}
.metric.score-na b,.metric.score-na span{color:var(--score-na-ink)}
.metric.expiry-urgent{background:var(--expiry-urgent-bg)}
.metric.expiry-urgent b,.metric.expiry-urgent span{color:var(--expiry-urgent)}
.metric.expiry-watch{background:var(--expiry-watch-bg)}
.metric.expiry-watch b,.metric.expiry-watch span{color:var(--expiry-watch)}
.metric.expiry-safe{background:var(--expiry-safe-bg)}
.metric.expiry-safe b,.metric.expiry-safe span{color:var(--expiry-safe)}
.card.expiry-urgent{border-color:#efb8b3;box-shadow:0 8px 26px rgba(189,49,40,.10)}
.card.expiry-watch{border-color:#efd99d}
.card.expiry-safe{border-color:#cfe5d9}
.reason{margin:0;padding:12px 14px;border-left:3px solid var(--accent);background:#fff8ef;color:#4d3a2d;font-size:13px;line-height:1.65}
.rules{margin:13px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13px;line-height:1.65}
.rules li+li{margin-top:4px}
.button{display:flex;align-items:center;justify-content:center;min-height:46px;margin-top:16px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px;font-weight:700}
.button-secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
.button:active{transform:translateY(1px)}
.store-clues{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.store-clues summary{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 13px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:800;list-style:none}
.store-clues summary::-webkit-details-marker{display:none}
.store-clues summary::after{content:"展开";flex:0 0 auto;color:var(--accent);font-size:11px;font-weight:700}
.store-clues[open] summary::after{content:"收起"}
.store-clues summary span{color:var(--muted);font-size:11px;font-weight:500}
.store-list{display:grid;gap:9px;padding:0 10px 10px}
.store-row{padding:11px;border-radius:11px;background:#f8f5f1}
.store-row-head{display:flex;gap:8px;align-items:center;justify-content:space-between}
.store-row strong{font-size:13px}
.store-score{flex:0 0 auto;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800}
.store-score.score-high{background:var(--score-high);color:var(--score-high-ink)}
.store-score.score-mid{background:var(--score-mid);color:var(--score-mid-ink)}
.store-score.score-low{background:var(--score-low);color:var(--score-low-ink)}
.store-score.score-na{background:var(--score-na);color:var(--score-na-ink)}
.tag.score-high{background:var(--score-high);color:var(--score-high-ink)}
.tag.score-mid{background:var(--score-mid);color:var(--score-mid-ink)}
.tag.score-low{background:var(--score-low);color:var(--score-low-ink)}
.tag.score-na{background:var(--score-na);color:var(--score-na-ink)}
.store-meta{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.store-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.store-links a{color:var(--accent);font-size:12px;font-weight:700;text-decoration:none}
.confirmed-stores .store-row.current{outline:2px solid rgba(216,91,37,.22);background:#fff8ef}
.current-mark{margin-left:5px;color:var(--accent);font-size:10px;font-weight:800}
.notes{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.74)}
.notes h3{margin:0 0 10px;font-size:15px}
.notes ul{margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.7}
.status{padding:28px 18px;border:1px dashed var(--line);border-radius:16px;background:#fff;text-align:center;color:var(--muted);line-height:1.65}
.planner{margin:22px 0 8px;scroll-margin-top:72px}
.map-panel{margin:0;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,253,249,.96)}
.map-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.map-head strong{font-size:15px}
.map-head span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.5}
.map-count{flex:0 0 auto;color:var(--accent);font-size:12px;font-weight:700}
.purchase-map{height:280px;border-radius:14px;background:#ece8e2;overflow:hidden}
.map-status{margin:10px 2px 0;color:var(--muted);font-size:12px;line-height:1.55}
.map-status.error{color:#9d463f}
.decision-list{display:grid;gap:8px;margin-top:10px}
.decision-link{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:inherit;text-decoration:none}
.decision-main{min-width:0}
.decision-main strong{display:block;overflow:hidden;font-size:13px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}
.decision-main span{display:block;margin-top:3px;overflow:hidden;color:var(--muted);font-size:11px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}
.decision-meta{display:flex;flex:0 0 auto;flex-direction:column;gap:3px;align-items:flex-end;color:var(--muted);font-size:10px}
.decision-meta b{font-size:12px}
.decision-meta .decision-price{color:var(--green);font-size:12px;font-weight:800}
.decision-meta del{margin-left:4px;color:#9a9188;font-size:10px;font-weight:500}
.leaflet-popup-content{max-width:240px;margin:12px 14px;line-height:1.55}
.leaflet-popup-content strong{display:block;margin-bottom:4px}
.leaflet-popup-content span{display:block}
.leaflet-popup-content ul{margin:6px 0 0;padding-left:18px}
footer{margin-top:24px;color:#8c8177;font-size:11px;line-height:1.6;text-align:center}
@media(max-width:420px){main{padding-top:14px}.hero{padding-top:16px}h1{font-size:27px}.quick-nav{margin-left:-2px;margin-right:-2px}.quick-nav a{padding:0 11px}.metrics{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between}.metric span{margin:0}.card-body{padding:14px}.card h2{font-size:17px}.purchase-map{height:230px}.map-head{display:block}.map-count{margin-top:6px}.decision-link{padding:10px}.decision-main{max-width:68%}}
</style>
</head>
<body>
<main>
<a class="back" href="../">← Shared Tools</a>
<section class="hero">
<p class="eyebrow">生活 · 武汉</p>
<h1>美食优惠雷达</h1>
<p class="lede">每天 10:01 起筛选 PASS 可兑换免费试，并汇总大众点评 App 已确认可使用的已购美食套餐。以融侨城周边为公开距离参考，不包含家庭坐标、订单号、券码或账号数据。</p>
</section>
<nav class="quick-nav" aria-label="页面快速跳转">
<a class="primary" href="#purchase-planner">本周安排 <span id="quick-purchase-count"></span></a>
<a href="#purchased-deals">套餐详情</a>
<a href="#pass-trials">PASS <span id="quick-pass-count"></span></a>
</nav>
<section id="purchase-planner" class="planner" hidden></section>
<div id="summary" class="summary" hidden></div>
<div id="sections" aria-live="polite">
<div class="status">正在读取今日结果…</div>
</div>
<section id="notes" class="notes" hidden>
<h3>阅读提示</h3>
<ul></ul>
</section>
<footer id="footer">PASS 来自公开活动页；已购套餐来自 App“可使用”列表并仅展示脱敏信息。最终使用条件以平台和门店说明为准。</footer>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const esc=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
const fmt=value=>Number(value||0).toLocaleString("zh-CN");
const shanghaiDateKey=()=>{
  const parts=new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const value=type=>parts.find(part=>part.type===type)?.value||"";
  return `${value("year")}-${value("month")}-${value("day")}`;
};
const dateKeyToDayNumber=value=>{
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||""));
  return match?Math.floor(Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3]))/86400000):NaN;
};
const compactDate=value=>{
  const match=/^\d{4}-(\d{2})-(\d{2})$/.exec(String(value||""));
  return match?`${Number(match[1])}/${Number(match[2])}`:"日期待确认";
};
const expiryMeta=(validUntil,todayKey)=>{
  const remaining=dateKeyToDayNumber(validUntil)-dateKeyToDayNumber(todayKey);
  if(!Number.isFinite(remaining))return {remaining:null,className:"expiry-watch",label:"到期日待核验",short:"待核验",color:"#a96b08"};
  if(remaining<=3)return {remaining,className:"expiry-urgent",label:remaining===0?"今天到期":remaining===1?"明天到期":`剩余 ${remaining} 天`,short:"3天内到期",color:"#bd3128"};
  if(remaining<=7)return {remaining,className:"expiry-watch",label:`剩余 ${remaining} 天`,short:"7天内到期",color:"#a96b08"};
  return {remaining,className:"expiry-safe",label:`剩余 ${remaining} 天`,short:"有效期充足",color:"#23754f"};
};
const WEEKEND_META={
  weekdays_only:{label:"仅工作日",className:""},
  weekend_available:{label:"全周都可",className:""},
  weekend_except_saturday:{label:"周六不可用",className:""},
  unknown:{label:"待确认",className:"weekend-unknown"}
};
const DEAL_TYPE_LABEL={package:"套餐",voucher:"代金券",drink:"饮品",single_dish:"单品",buffet:"自助餐",checkin_gift:"打卡小食"};
const sections=document.querySelector("#sections");
const summary=document.querySelector("#summary");
const notes=document.querySelector("#notes");
const planner=document.querySelector("#purchase-planner");

const GROUPS=[
  {id:"purchased-deals",kind:"purchased_deal",source:"purchasedDeals",dataset:"purchases",title:"我的已购套餐",target:"按到期日排序",desc:"先看位置、菜系和到期时间；感兴趣再展开门店详情。"},
  {id:"pass-trials",kind:"pass_free_trial",source:"passFreeTrial",dataset:"radar",title:"PASS 可兑换免费试",target:"约 5 个",desc:"必须支持 PASS 且剩余名额大于 0；近场和高价值优先。"}
];

const safeUrl=value=>{
  try{const url=new URL(String(value||""),location.href);return url.protocol==="https:"?esc(url.href):"#"}catch{return "#"}
};

function metric(value,label,className=""){
  return value===undefined||value===null||value===""?"":`<div class="metric ${esc(className)}"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;
}

function scoreMetric(score){
  if(score===undefined||score===null||score==="")return metric("暂无","门店评分 · 未公开","score-na");
  const value=Number(score);
  if(!Number.isFinite(value))return metric("暂无","门店评分 · 未公开","score-na");
  if(value>=4)return metric(`${value.toFixed(1)} 分`,"门店评分 · 4.0分及以上","score-high");
  if(value>=3)return metric(`${value.toFixed(1)} 分`,"门店评分 · 3.0–3.9分","score-mid");
  return metric(`${value.toFixed(1)} 分`,"门店评分 · 3.0分以下","score-low");
}

function scoreClass(score){
  const value=Number(score);
  if(score===null||score===undefined||!Number.isFinite(value))return "score-na";
  if(value>=4)return "score-high";
  if(value>=3)return "score-mid";
  return "score-low";
}

function scoreTag(score){
  const label=score==null?"暂无评分":`${Number(score).toFixed(1)}分`;
  return `<span class="tag ${scoreClass(score)}">${esc(label)}</span>`;
}

function renderConfirmedStoreRows(item){
  const stores=Array.isArray(item.confirmedStores)?item.confirmedStores:[];
  if(!stores.length)return "";
  return stores.map(store=>{
    const score=store.score==null?"暂无评分":`${Number(store.score).toFixed(1)} 分`;
    const location=[store.area,store.address].filter(Boolean).join(" · ");
    const mapLink=store.mapSearchUrl?`<div class="store-links"><a href="${safeUrl(store.mapSearchUrl)}" target="_blank" rel="noopener noreferrer">地图查看</a></div>`:"";
    return `<div class="store-row${store.currentDetail?" current":""}">
      <div class="store-row-head"><strong>${esc(store.shop)}（${esc(store.branch)}）${store.currentDetail?'<span class="current-mark">当前详情门店</span>':""}</strong><span class="store-score ${scoreClass(store.score)}">${esc(score)}</span></div>
      ${location?`<p class="store-meta">${esc(location)}</p>`:""}
      ${store.businessHours?`<p class="store-meta">门店营业时间：${esc(store.businessHours)}</p>`:""}
      ${store.scoreSource?`<p class="store-meta">评分来源：${esc(store.scoreSource)}${store.reviewCount!=null?` · ${fmt(store.reviewCount)} 条评价/评分`:""}</p>`:""}
      ${mapLink}
    </div>`;
  }).join("");
}

function renderPurchaseMore(item){
  const stores=Array.isArray(item.confirmedStores)?item.confirmedStores:[];
  const useWindow=item.useWindow?`<p><strong>可用时段：</strong>${esc(item.useWindow)}</p>`:"";
  return `<details class="purchase-more"><summary>门店与使用说明（${fmt(stores.length)} 家）</summary><div class="purchase-more-body">
    <div class="compact-use"><p><strong>有效期：</strong>${esc(item.validUntil||"待确认")}</p>${useWindow}</div>
    <div class="store-list">${renderConfirmedStoreRows(item)}</div>
  </div></details>`;
}

function renderItem(item,todayKey){
  const kind=item.kind||item.dealType;
  const kindMeta={pass_free_trial:{label:"PASS 免费试",className:""}}[kind]||{label:item.tag||"优惠",className:""};
  const expiry=kind==="purchased_deal"?expiryMeta(item.validUntil,todayKey):null;
  const weekend=kind==="purchased_deal"?(WEEKEND_META[item.weekendPolicy]||WEEKEND_META.unknown):null;
  const badges=kind==="purchased_deal"?[]:[`<span class="tag ${kindMeta.className}">${esc(kindMeta.label)}</span>`];
  if(item.vipOnly&&kind==="pass_free_trial")badges.push('<span class="tag vip">橙V免费试</span>');
  if(kind==="purchased_deal"&&item.foodType)badges.push(`<span class="tag platform">${esc(item.foodType)}</span>`);
  if(expiry)badges.push(`<span class="tag ${expiry.className}">${esc(`${compactDate(item.validUntil)} · ${expiry.short}`)}</span>`);
  if(weekend)badges.push(`<span class="tag weekend ${weekend.className}">${esc(weekend.label)}</span>`);
  if(kind==="purchased_deal")badges.push(scoreTag(item.score));
  const distance=item.distanceLabel||item.proximity;
  const metrics=[];
  let price="";
  if(kind==="pass_free_trial"){
    price="0元 · PASS";
    metrics.push(metric(`${fmt(item.passRemaining)} / ${fmt(item.passCapacity)}`,"PASS 剩余 / 总量"));
    metrics.push(metric(item.referenceValueCny!=null?`标称 ¥${fmt(item.referenceValueCny)}`:null,"平台标称价值"));
  }else if(kind==="purchased_deal"){
    const current=item.purchasePriceCny!=null?`<span class="price-current">¥${fmt(item.purchasePriceCny)}</span>`:"<span>已购买</span>";
    const comparison=item.comparisonPriceCny!=null?`<del>¥${fmt(item.comparisonPriceCny)}</del>`:"";
    price=`${current}${comparison}`;
  }
  if(kind!=="purchased_deal"){
    metrics.push(metric(distance,"距公开参考点"));
    metrics.push(scoreMetric(item.score));
  }
  const rules=kind==="purchased_deal"?"":[
    item.deadline?["截止",item.deadline]:null,
    kind!=="purchased_deal"&&item.validUntil?["有效期",item.validUntil]:null,
    item.useWindow?["使用",item.useWindow]:null,
    item.holidayPolicy?["节假日",item.holidayPolicy]:null,
    item.reservationPolicy?["预约",item.reservationPolicy]:null,
    item.roomPolicy?["包间",item.roomPolicy]:null,
    item.stackingPolicy?["叠加",item.stackingPolicy]:null,
    item.surchargePolicy?["加价",item.surchargePolicy]:null,
    item.refundPolicy?["退款",item.refundPolicy]:null,
    item.restrictions?["其他限制",item.restrictions]:null
  ].filter(Boolean).map(([label,value])=>`<li><strong>${esc(label)}：</strong>${esc(value)}</li>`).join("");
  const buttonLabel=kind==="purchased_deal"?"打开套餐详情":"打开免费试活动页";
  const button=item.detailUrl?`<a class="button" href="${safeUrl(item.detailUrl)}" target="_blank" rel="noopener noreferrer">${buttonLabel}</a>`:"";
  const purchaseMore=kind==="purchased_deal"?renderPurchaseMore(item):"";
  const firstStore=Array.isArray(item.eligibleStores)&&item.eligibleStores.length?item.eligibleStores[0]:null;
  const place=kind==="purchased_deal"
    ?[item.shop||firstStore?.shop||"门店待核验",item.branch||firstStore?.branch,item.area||firstStore?.area]
    :[item.area,item.branch,distance];
  const cardClass=expiry?` ${expiry.className}`:"";
  const menuFallback=kind==="purchased_deal"?"订单页未公开菜品明细。":"活动页未公开菜品明细";
  const cardId=kind==="purchased_deal"?` id="deal-${esc(item.sourceId)}"`:"";
  return `<article${cardId} class="card${cardClass}"><div class="card-body">
    <div class="topline"><div class="tags">${badges.join("")}</div><span class="price">${price}</span></div>
    <h2>${esc(item.title)}</h2>
    <p class="place">${place.filter(Boolean).map(esc).join(" · ")}</p>
    <p class="menu"><strong>主要菜品：</strong>${esc(item.menuSummary||menuFallback)}</p>
    ${metrics.length?`<div class="metrics">${metrics.join("")}</div>`:""}
    ${kind!=="purchased_deal"&&item.reason?`<p class="reason">${esc(item.reason)}</p>`:""}
    ${rules?`<ul class="rules">${rules}</ul>`:""}
    ${purchaseMore}
    ${button}
  </div></article>`;
}

function renderPurchaseMapShell(items){
  const stores=items.flatMap(item=>Array.isArray(item.confirmedStores)?item.confirmedStores:[]).filter(store=>Number.isFinite(store.lat)&&Number.isFinite(store.lng));
  const exactCount=stores.filter(store=>store.coordinateAccuracy==="store").length;
  const addressCount=stores.length-exactCount;
  return `<div class="map-panel">
    <div class="map-head"><div><strong>已购美食分布</strong><span>颜色对应到期提醒；实心点是门店定位，虚线点是商场或楼宇地址定位。</span></div><div class="map-count">${fmt(stores.length)} 家全部落图<br>门店 ${fmt(exactCount)} · 地址 ${fmt(addressCount)}</div></div>
    <div id="purchase-map" class="purchase-map" role="region" aria-label="已购美食门店地图"></div>
    <p id="purchase-map-status" class="map-status">正在读取已核验门店位置…</p>
  </div>`;
}

function renderDecisionList(items,todayKey){
  return `<div class="decision-list">${items.map(item=>{
    const expiry=expiryMeta(item.validUntil,todayKey);
    const weekend=WEEKEND_META[item.weekendPolicy]||WEEKEND_META.unknown;
    const shop=[item.shop,item.branch].filter(Boolean).join(" · ");
    const details=[item.foodType,item.menuSummary].filter(Boolean).join(" · ");
    const comparison=item.comparisonPriceCny!=null?`<del>¥${fmt(item.comparisonPriceCny)}</del>`:"";
    const current=item.purchasePriceCny!=null?`¥${fmt(item.purchasePriceCny)}`:"已购买";
    return `<a class="decision-link" href="#deal-${esc(item.sourceId)}">
      <span class="decision-main"><strong>${esc(shop)}</strong><span>${esc(details)}</span></span>
      <span class="decision-meta"><b style="color:${expiry.color}">${esc(`${compactDate(item.validUntil)} · ${expiry.label}`)}</b><span>${esc(weekend.label)}</span><span class="decision-price">${current}${comparison}</span></span>
    </a>`;
  }).join("")}</div>`;
}

function renderPurchasePlanner(items,todayKey){
  return `<div class="section-head"><div><h2>这周吃什么</h2><p>先按地图选区域，再看菜系、到期日和可用日期；点清单直接跳到套餐。</p></div><span class="target">${fmt(items.length)} 张可用券</span></div>${renderPurchaseMapShell(items)}${renderDecisionList(items,todayKey)}`;
}

function renderSection(group,items,source,todayKey){
  let body="";
  if(source?.status==="pending_sync"){body=`<div class="status">已购套餐等待首次同步。${source.note?`<br>${esc(source.note)}`:""}</div>`}
  else if(source?.status==="login_required"){body=`<div class="status">本轮需要登录后才能核验，暂不展示未经确认的候选。${source.note?`<br>${esc(source.note)}`:""}</div>`}
  else if(source?.status==="app_required"){body=`<div class="status">本轮关键条件只能在 App 内核验，暂不展示未经确认的候选。${source.note?`<br>${esc(source.note)}`:""}</div>`}
  else if(source?.status==="error"){body=`<div class="status">本轮数据源不可用：${esc(source.note||"稍后重试")}</div>`}
  else if(["ok","partial"].includes(source?.status)&&items.length){body=`<div class="list">${items.map(item=>renderItem(item,todayKey)).join("")}</div>`}
  else if(group.kind==="purchased_deal"){body='<div class="status">当前没有已确认仍可使用的已购套餐。</div>'}
  else{body='<div class="status">本轮没有符合条件且可用的项目。</div>'}
  return `<section id="${esc(group.id)}" class="section"><div class="section-head"><div><h2>${group.title}</h2><p>${group.desc}</p></div><span class="target">${group.target}</span></div>${body}</section>`;
}

function initPurchaseMap(items,todayKey){
  const container=document.querySelector("#purchase-map");
  const status=document.querySelector("#purchase-map-status");
  if(!container||!status)return;
  const rows=[];
  for(const item of items){
    for(const store of Array.isArray(item.confirmedStores)?item.confirmedStores:[]){
      if(Number.isFinite(store.lat)&&Number.isFinite(store.lng)){
        rows.push({item,store,approximate:store.coordinateAccuracy!=="store",expiry:expiryMeta(item.validUntil,todayKey)});
      }
    }
  }
  if(!rows.length){
    container.hidden=true;
    status.textContent="已确认门店，但本轮没有可安全公开的地图坐标。";
    return;
  }
  if(!window.L){
    container.hidden=true;
    status.classList.add("error");
    status.textContent="地图资源暂时未能加载，已购套餐卡片和文字门店仍可正常查看。";
    return;
  }
  try{
    const grouped=new Map();
    for(const row of rows){
      const key=`${row.store.lat.toFixed(6)},${row.store.lng.toFixed(6)}`;
      if(!grouped.has(key))grouped.set(key,{store:row.store,rows:[]});
      grouped.get(key).rows.push(row);
    }
    const map=window.L.map(container,{scrollWheelZoom:false,attributionControl:true});
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
    const bounds=[];
    for(const group of grouped.values()){
      const first=group.rows[0];
      const approximate=group.rows.every(row=>row.approximate);
      const popupItems=group.rows.map(row=>`<li><a href="#deal-${esc(row.item.sourceId)}">${esc(row.item.foodType||row.item.title)}</a> · ${esc(row.expiry.label)} · ${esc((WEEKEND_META[row.item.weekendPolicy]||WEEKEND_META.unknown).label)}</li>`).join("");
      const accuracyNote=approximate?"<span>商场或楼宇地址定位</span>":"";
      const popup=`<strong>${esc(group.store.shop)}${group.store.branch?`（${esc(group.store.branch)}）`:""}</strong><span>${esc(group.store.address||group.store.area||"")}</span>${accuracyNote}<ul>${popupItems}</ul>`;
      window.L.circleMarker([group.store.lat,group.store.lng],{radius:9,color:first.expiry.color,weight:3,dashArray:approximate?"4 3":null,fillColor:first.expiry.color,fillOpacity:approximate ? 0.3 : 0.75}).addTo(map).bindPopup(popup);
      bounds.push([group.store.lat,group.store.lng]);
    }
    if(bounds.length===1)map.setView(bounds[0],14);
    else map.fitBounds(bounds,{padding:[24,24],maxZoom:14});
    const exactCount=rows.filter(row=>!row.approximate).length;
    const addressCount=rows.length-exactCount;
    status.textContent=`地图已显示 ${rows.length} 家：${exactCount} 家门店定位、${addressCount} 家商场或楼宇地址定位。颜色与到期提醒一致。`;
  }catch{
    container.hidden=true;
    status.classList.add("error");
    status.textContent="地图暂时无法显示，已购套餐卡片和文字门店仍可正常查看。";
  }
}

const loadJson=file=>fetch(`${file}?v=${Date.now()}`,{cache:"no-store"})
  .then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()});

Promise.all([loadJson("./latest.json"),loadJson("./purchases.json")])
  .then(([radar,purchases])=>{
    const todayKey=shanghaiDateKey();
    const radarItems=(Array.isArray(radar.items)?radar.items:[])
      .filter(item=>item.kind==="pass_free_trial"&&item.availability==="available"&&radar.sources?.passFreeTrial?.status==="ok")
      .sort((a,b)=>(a.priorityRank??999)-(b.priorityRank??999));
    const purchasedItems=(Array.isArray(purchases.items)?purchases.items:[])
      .filter(item=>item.kind==="purchased_deal"&&item.availability==="usable_coupon"&&item.validUntil>=todayKey&&["ok","partial"].includes(purchases.sources?.purchasedDeals?.status))
      .sort((a,b)=>a.validUntil.localeCompare(b.validUntil)||(a.priorityRank??999)-(b.priorityRank??999));
    const datasets={radar:{data:radar,items:radarItems},purchases:{data:purchases,items:purchasedItems}};
    const purchaseHeadline=["ok","partial"].includes(purchases.sources?.purchasedDeals?.status)?`可用已购券 ${fmt(purchasedItems.length)} 张`:"已购套餐待同步";
    const updatedAt=[radar.generatedAt,purchases.updatedAt].filter(Boolean).sort().at(-1);
    summary.hidden=false;
    summary.innerHTML=`<span class="summary-dot"></span><div><strong>${esc(radar.summary?.headline||`今日 PASS ${radarItems.length} 条`)}；${esc(purchaseHeadline)}</strong><span>PASS ${fmt(radarItems.length)} 条 · ${esc(purchaseHeadline)} · 更新于 ${esc(new Date(updatedAt).toLocaleString("zh-CN",{hour12:false}))}</span></div>`;
    sections.innerHTML=GROUPS.map(group=>{
      const dataset=datasets[group.dataset];
      return renderSection(group,dataset.items.filter(item=>(item.kind||item.dealType)===group.kind),dataset.data.sources?.[group.source],todayKey);
    }).join("");
    if(["ok","partial"].includes(purchases.sources?.purchasedDeals?.status)&&purchasedItems.length){
      planner.hidden=false;
      planner.innerHTML=renderPurchasePlanner(purchasedItems,todayKey);
    }else{
      planner.hidden=true;
      planner.innerHTML="";
    }
    document.querySelector("#quick-pass-count").textContent=`（${fmt(radarItems.length)}）`;
    document.querySelector("#quick-purchase-count").textContent=`（${fmt(purchasedItems.length)}）`;
    initPurchaseMap(purchasedItems,todayKey);
    const tips=[...(Array.isArray(radar.notes)?radar.notes:[]),...(Array.isArray(purchases.notes)?purchases.notes:[])];
    if(tips.length){notes.hidden=false;notes.querySelector("ul").innerHTML=tips.map(tip=>`<li>${esc(tip)}</li>`).join("")}
  })
  .catch(()=>{sections.innerHTML='<div class="status">今日结果暂时加载失败，请稍后刷新。</div>'});
</script>

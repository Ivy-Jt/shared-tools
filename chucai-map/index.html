}).addTo(map);
const rongqiao = L.marker([30.6035,114.3595]).addTo(map).bindPopup("<b>融侨城（参考起点）</b>");
const cluster = L.markerClusterGroup();
let currentMarkers = [];

function buildRegionOptions() {
  const sel = document.getElementById('regionFilter');
  [...new Set(data.map(d=>d.region))].sort().forEach(r => {
    const op = document.createElement('option');
    op.value = r; op.textContent = r;
    sel.appendChild(op);
  });
}

function applyFilters() {
  const region = document.getElementById('regionFilter').value;
  const bucket = document.getElementById('bucketFilter').value;
  const kw = document.getElementById('nameFilter').value.trim().toLowerCase();
  const worthOnly = document.getElementById('worthOnly').checked;
  cluster.clearLayers();
  currentMarkers = [];
  data.filter(d => {
    if (region !== '全部' && d.region !== region) return false;
    if (bucket !== '全部' && d.bucket !== bucket) return false;
    if (kw && !d.name.toLowerCase().includes(kw)) return false;
    if (worthOnly && d.worth !== '高') return false;
    return true;
  }).forEach(d => {
    const m = L.circleMarker([d.lat, d.lon], {
      radius: d.size, color: d.color, fillColor: d.color, fillOpacity: 0.85, weight: 1
    }).bindPopup(d.popup);
    cluster.addLayer(m);
    currentMarkers.push(m);
  });
  map.addLayer(cluster);
  if (currentMarkers.length > 0) {
    const group = new L.featureGroup(currentMarkers.concat([rongqiao]));
    map.fitBounds(group.getBounds().pad(0.12));
  }
}
buildRegionOptions();
applyFilters();
document.getElementById('regionFilter').addEventListener('change', applyFilters);
document.getElementById('bucketFilter').addEventListener('change', applyFilters);
document.getElementById('nameFilter').addEventListener('input', applyFilters);
document.getElementById('worthOnly').addEventListener('change', applyFilters);

  if(isMap){
    $('map-status').textContent='正在加载地图…';
    try{await ensureMap();if(mode==='map')renderMap()}
    catch{$('map-status').textContent='地图暂时未能加载，可继续查看景点清单，或再次点击地图搜索重试。'}
  }
}
$('list-view').addEventListener('click',()=>setView('list'));
$('map-view').addEventListener('click',()=>setView('map'));
['regionFilter','bucketFilter','worthOnly'].forEach(id=>$(id).addEventListener('change',applyFilters));
$('nameFilter').addEventListener('input',applyFilters);
$('reset').addEventListener('click',()=>{$('nameFilter').value='';$('regionFilter').value='全部';$('bucketFilter').value='全部';$('worthOnly').checked=false;applyFilters()});
applyFilters();
</script>
</body>
</html>

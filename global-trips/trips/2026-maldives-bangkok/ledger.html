<section class="budget-section" id="journal-budget"><div class="inner"><header class="section-head"><div><div class="section-num">我们的账本</div><h2 class="section-title">旅行花费</h2><div class="budget-viz"><div class="budget-viz-heading"><h3>花费分布</h3></div><div class="budget-viz-flex"><div class="donut" id="journal-spendDonut"><div class="donut-core"><small>合计</small><b id="journal-donutTotal">—</b></div></div><div class="viz-legend" id="journal-spendLegend"></div></div></div></div></header><div class="budget-banner"><div class="bmetric"><small>机票与酒店</small><strong id="journal-majorTotal">—</strong></div><div class="bmetric"><small>其他花费</small><strong id="journal-otherTotal">—</strong></div><div class="bmetric"><small>总花费</small><strong id="journal-grandTotal">—</strong></div></div>
<div class="budget-tools"><label class="fx">汇率：1 THB = <input id="journal-fxRate" max="1" min="0.01" step="0.001" type="number" value="0.200"> CNY</label><button class="toolbtn" id="journal-addRow">＋ 新增项目</button><button class="toolbtn" id="journal-exportJson">导出账本 JSON</button><button class="toolbtn" id="journal-exportCsv">导出 CSV</button><button class="toolbtn" id="journal-resetBudget">恢复原始记录</button></div>
<form id="journal-newExpense" class="new-expense" hidden>
<h3>新增消费项目</h3><div class="expense-fields">
<label>项目名称<input name="item" required maxlength="120" placeholder="例如：马累机场咖啡"></label>
<label>类别<select name="category"><option>餐饮</option><option>交通</option><option>住宿</option><option>购物</option><option>体验</option><option>行前采购</option><option>其他</option></select></label>
<label>金额<input name="amount" type="number" required min="0" step="0.01" inputmode="decimal"></label>
<label>币种<select name="currency"><option value="CNY">人民币</option><option value="THB">泰铢</option></select></label>
<label>金额依据<select name="status"><option value="paid">实际支付</option><option value="estimate">估算</option></select></label>
<label>备注<input name="note" maxlength="500" placeholder="选填"></label></div>
<div class="expense-actions"><button type="submit">保存并计入合计</button><button type="button" id="journal-cancelExpense">取消</button></div></form><p id="journal-addStatus" role="status" aria-live="polite"></p>
<div class="table-wrap"><table class="ledger"><thead><tr><th>类别</th><th>项目</th><th>币种</th><th>金额</th><th>状态</th><th>计入</th><th>折人民币</th></tr></thead><tbody id="journal-ledgerBody"></tbody></table></div><div class="sumline"><div id="journal-countNotice"></div><div>合计：<b id="journal-footerTotal">—</b></div></div><details class="ledger-storage"><summary>保存与备份</summary><p>修改保存在当前浏览器，可导出 JSON 或 CSV 备份。</p></details></div></section>
